- name: Check if Zap plugin manager is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/share/zap/zap.zsh"
  register: zap_check

- name: Install Zap plugin manager
  ansible.builtin.shell:
    cmd: "curl -s https://raw.githubusercontent.com/zap-zsh/zap/master/install.zsh | zsh"
  register: zap_install
  changed_when: "'Zap installed' in zap_install.stdout or 'Zap installed' in zap_install.stderr"
  failed_when: false
  when: not zap_check.stat.exists
