---
- name: Enable ParallelDownloads
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^#?ParallelDownloads\s*='
    line: 'ParallelDownloads = 5'
    insertafter: '^#?\[options\]'

- name: Perform a full system update (pacman -Syu)
  community.general.pacman:
    update_cache: true
    upgrade: true
  become: true

- name: Install System Foundations
  community.general.pacman:
    name: "{{ system_packages }}"
    state: present
  become: true

- name: Create the 'aur_builder' user for secure compiling
  ansible.builtin.user:
    name: aur_builder
    create_home: true
    group: wheel
    system: true
  become: true

- name: Allow 'aur_builder' to run pacman without a password
  ansible.builtin.copy:
    content: "aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
    dest: /etc/sudoers.d/11-install-aur_builder
    mode: '0440'
    validate: 'visudo -cf %s'
  become: true

- name: Install NVIDIA Graphics (Zen/DKMS)
  community.general.pacman:
    name: "{{ nvidia_packages }}"
    state: present
  become: true
  tags: ['nvidia']

- name: Enable NVIDIA Early Modesetting in Limine
  ansible.builtin.replace:
    path: "{{ limine_conf_path }}"
    # Regex logic: Find lines starting with 'cmdline:' that DON'T have the flag yet
    regexp: '^(\s*cmdline: (?!.*nvidia_drm\.modeset=1).*)'
    replace: '\1 nvidia_drm.modeset=1'
  become: true
  tags: ['nvidia']

- name: Ensure mkinitcpio drop-in directory exists
  ansible.builtin.file:
    path: /etc/mkinitcpio.conf.d
    state: directory
    mode: '0755'
  become: true

- name: Configure Early KMS and filesystem modules via drop-in
  ansible.builtin.copy:
    dest: /etc/mkinitcpio.conf.d/nvidia_btrfs.conf
    content: |
      # Ansible managed: Early KMS for NVIDIA and BTRFS support
      MODULES=(btrfs nvidia nvidia_modeset nvidia_uvm nvidia_drm)
    mode: '0644'
  notify: Regenerate initramfs
  become: true
  tags: ['nvidia']

- name: Configure NetworkManager to use iwd backend
  ansible.builtin.copy:
    dest: /etc/NetworkManager/conf.d/wifi_backend.conf
    content: |
      [device]
      wifi.backend=iwd
    mode: '0644'
  become: true

- name: Basic Firewall Setup (UFW)
  become: true
  block:
    - name: Deny incoming connections by default
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Allow outgoing connections by default
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable UFW
      community.general.ufw:
        state: enabled

- name: Enable and Start System Services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ enable_services }}"
  become: true
