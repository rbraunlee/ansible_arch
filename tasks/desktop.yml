- name: Install Hyprland Ecosystem
  community.general.pacman:
    name: "{{ desktop_packages }}"
    state: present
  become: true

- name: Install Audio Stack (PipeWire)
  community.general.pacman:
    name: "{{ audio_packages }}"
    state: present
  become: true

- name: Set Zsh as the default shell
  ansible.builtin.user:
    name: "{{ username }}"
    shell: /usr/bin/zsh
  become: true

- name: Ensure base .config directory exists
  ansible.builtin.file:
    path: "/home/{{ username }}/.config"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0755'
