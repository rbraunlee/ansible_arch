---
- name: Require the checked dotfiles revision before rendering the overlay
  ansible.builtin.assert:
    that:
      - preflight_dotfiles_revision is string
      - dotfiles_checkout is defined
      - (dotfiles_checkout | default({})).after | default('') == preflight_dotfiles_revision
    fail_msg: >-
      The deployed dotfiles checkout differs from the revision validated by the
      optional-profile preflight. Refusing to render the Hyprland overlay.
    quiet: true
  tags:
    - dotfiles
    - optional

- name: Render the canonical Hyprland optional overlay safely
  ansible.builtin.command:
    argv:
      - /usr/bin/python
      - "{{ lookup('ansible.builtin.first_found', ['hyprland_optional_overlay.py']) }}"
      - --home
      - "/home/{{ username }}"
      - --username
      - "{{ username }}"
      - --voxtype-enabled
      - "{{ optional_profiles.voxtype.enabled | ternary('true', 'false') }}"
      - --nvidia-environment
      - "{{ use_nvidia | ternary('true', 'false') }}"
  register: hyprland_optional_overlay
  changed_when: (hyprland_optional_overlay.stdout | from_json).changed
  environment:
    ANSIBLE_ARCH_OPTIONAL_OVERLAY_CHECK: "{{ ansible_check_mode | ternary('1', '0') }}"
  become: true
  become_user: "{{ username }}"
  tags:
    - dotfiles
    - optional
